# Native (no MAUI) ground-truth sample for Swipewalk: a UIKit screen and a SwiftUI
# screen around the same "Pay a parking ticket" flow, planted with the same bug
# classes as samples/BuggyApp. Regenerate with `xcodegen generate` (run from this
# directory) after editing this file or the Runner sources.
name: NativeiOS
options:
  bundleIdPrefix: org.swipewalk
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    # Override with CF_BUNDLE_PREFIX=... to fit an installed wildcard profile (e.g. com.company.*).
    CF_BUNDLE_PREFIX: org.swipewalk
targets:
  NativeiOS:
    type: application
    platform: iOS
    sources: [Runner]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CF_BUNDLE_PREFIX).nativeios
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
schemes:
  NativeiOS:
    build:
      targets:
        NativeiOS: all
