# Thin iOS harness: attaches to an installed app by bundle id, dumps the accessibility
# snapshot, a screenshot and Apple's accessibility audit as JSON. Regenerate with `xcodegen`.
name: SwipewalkHarness
options:
  bundleIdPrefix: org.swipewalk
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    # Override with CF_BUNDLE_PREFIX=... to fit an installed wildcard profile (e.g. com.company.*).
    CF_BUNDLE_PREFIX: org.swipewalk.harness
targets:
  Runner:
    type: application
    platform: iOS
    sources: [Runner]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CF_BUNDLE_PREFIX).runner
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  HarnessUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [HarnessUITests]
    dependencies:
      - target: Runner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CF_BUNDLE_PREFIX).uitests
        TEST_TARGET_NAME: Runner
schemes:
  Harness:
    build:
      targets:
        Runner: all
        HarnessUITests: [test]
    test:
      targets: [HarnessUITests]
