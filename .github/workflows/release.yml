name: Release

# Push a tag like v0.1.0 (matching <Version> in Directory.Build.props) to publish the CLI to NuGet
# and create a GitHub release. Publishing uses NuGet Trusted Publishing (a nuget.org policy for this
# repository and release.yml), so no API key is stored; NUGET_USER is the nuget.org profile name.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # lets NuGet/login exchange a GitHub token for a one-hour NuGet API key

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Check the tag matches the version
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      # Built once here so `dotnet pack` below bundles the prebuilt APK (see
      # Swipewalk.Collectors.csproj) -- see ci.yml's identical step for why this is fine to build in
      # CI even though the published package needs no JDK/Gradle/network to use it.
      - name: Build Android harness APKs (bundled into the package)
        run: .github/scripts/build-android-harness.sh
      - run: dotnet test Swipewalk.slnx -c Release
      - run: dotnet pack src/Swipewalk.Cli -c Release -o artifacts
      - name: NuGet login (short-lived API key)
        uses: NuGet/login@v1
        id: nuget
        with:
          user: ${{ secrets.NUGET_USER }}
      - run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
      - run: gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
