name: Bug
description: A scan fails, crashes or behaves unexpectedly.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the command you ran and the output. Remove device serials, paths and personal data; pasted output is not cleaned for you.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "macOS 26.6, .NET 10.0.100, Android 16 emulator"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Swipewalk version
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic report
      description: |
        Attach the file from Help > Save Diagnostic Report… in the desktop app, or from `swipewalk diagnostics`. Read it first and remove anything you don't want to share. It is made on your computer; device serials, device names, team IDs and your user name are removed by pattern, which can miss something, and the package or bundle id of each app you scanned is kept. Issues are public.
      placeholder: Drag the .txt file here
